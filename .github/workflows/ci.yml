name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uvx ruff check backend
      - run: uvx ruff format --check backend

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11" # matches frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx biome check .
      - run: npx tsc -b --noEmit
      - run: npm run build

  cerbos-policies:
    name: Cerbos compile and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `compile` validates every policy and runs the *_test.yaml suites;
      # it exits non-zero on a compile error or a failed test.
      - run: docker run --rm -v "$PWD/cerbos/policies:/policies" ghcr.io/cerbos/cerbos:0.57.0 compile /policies

  integration:
    name: Backend tests and end-to-end run (Docker Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same command a reviewer runs locally: Cerbos policy tests, backend tests
      # against a disposable database and a separate test Cerbos, then an end-to-end
      # run through the dashboard, Cerbos and LiteLLM (including the in-LiteLLM guard).
      - run: python3 scripts/demo.py test
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
