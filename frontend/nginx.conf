server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  # Matches the API's own 64 KiB request limit.
  client_max_body_size 64k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Forwarded to the API for logging and for correct scheme/host handling.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://api:8000;
  }
  location /v1/ {
    proxy_pass http://api:8000;
    proxy_read_timeout 70s;
  }
  # Interactive API reference, so the dashboard can link to it on the same origin.
  location = /docs {
    proxy_pass http://api:8000;
  }
  location = /openapi.json {
    proxy_pass http://api:8000;
  }

  # Vite emits content-hashed filenames, so these are safe to cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Fluent UI (Griffel) injects runtime style tags, hence 'unsafe-inline' for styles only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
