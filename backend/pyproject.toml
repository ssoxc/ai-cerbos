[project]
name = "ai-cerbos-api"
version = "0.1.0"
description = "Scoped AI governance with Cerbos and LiteLLM"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "cryptography>=44",
  "PyJWT>=2.10,<3",
  "pyyaml>=6,<7",
  "mcp>=2.2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "python-dotenv>=1,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
